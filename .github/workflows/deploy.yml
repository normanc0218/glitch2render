name: Deploy to Firebase

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: cd my-functions && npm install
      - name: Run tests
        run: cd my-functions && npm test
        env:
          NODE_ENV: test

  deploy:
    name: Deploy to Firebase
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install my-functions dependencies
        run: cd my-functions && npm install
      - name: Install functions dependencies
        run: cd functions && npm install
      - run: npm install -g firebase-tools

      - name: Write service account key
        env:
          SERVICE_ACCOUNT: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        run: |
          echo "$SERVICE_ACCOUNT" > service-account.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=${{ github.workspace }}/service-account.json" >> $GITHUB_ENV

      - name: Write runtime env file
        run: |
          {
            echo "SLACK_BOT_TOKEN=${{ secrets.SLACK_BOT_TOKEN }}"
            echo "SLACK_SIGNING_SECRET=${{ secrets.SLACK_SIGNING_SECRET }}"
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}"
            echo "INSTANCE_CONNECTION_NAME=${{ secrets.INSTANCE_CONNECTION_NAME }}"
            echo "PG_USER=${{ secrets.PG_USER }}"
            echo "PG_PASSWORD=${{ secrets.PG_PASSWORD }}"
            echo "PG_DATABASE=${{ secrets.PG_DATABASE }}"
            echo "SLACK_NOTIFICATION_CHANNEL_ID=${{ secrets.SLACK_NOTIFICATION_CHANNEL_ID }}"
          } > my-functions/.env

      - name: Deploy to Firebase
        run: firebase deploy --only functions:slack-app --project maintenance-form-602d9 --force
